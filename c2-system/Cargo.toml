[package]
name = "c2-system"
version = "0.1.0"
edition = "2021"
authors = ["Abigail Cross"]
description = "Resilient Command & Control system with multiple fallback channels"

# Single crate for now - workspace can be added later

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
ring = "0.17"

# Networking
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.24"
quinn = "0.11"
hickory-resolver = "0.24"

# DNS C2
trust-dns-resolver = "0.23"

# Protocol buffers
prost = "0.13"
prost-types = "0.13"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
toml = "0.8"

# UUID
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Base encoding
base64 = "0.22"

# HTTP client for HTTP C2
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }

# Base32 encoding for DNS
base32 = "0.5"
# Hex encoding
hex = "0.4"

# P2P (libp2p)
libp2p = { version = "0.54", default-features = false, features = [
    "autonat",
    "ed25519",
    "gossipsub",
    "identify",
    "kad",
    "macros",
    "mdns",
    "noise",
    "ping",
    "quic",
    "tcp",
    "tls",
    "tokio",
    "yamux",
] }
futures = "0.3"

[dev-dependencies]
tempfile = "3.13"
rstest = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
